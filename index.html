const key="mhwilds-crown-pwa-v12";
const legacyKeys=["mhwilds-crown-pwa-v11","mhwilds-crown-pwa-v10","mhwilds-crown-pwa-v7","mhwilds-crown-pwa-v6","mhwilds-crown-standalone-v5","mhwilds-crown-standalone-v4"];
const listEl=document.getElementById("list");

function normalize(a){
  return a.map((x,i)=>({...x,
    max: x.max===null ? null : (x.max?1:0),
    min: x.min===null ? null : (x.min?1:0),
    lmax: x.lmax===null ? null : (x.lmax?1:0),
    lmin: x.lmin===null ? null : (x.lmin?1:0),
    limitMin: x.limitMin ?? initial[i].limitMin ?? null,
    limitMax: x.limitMax ?? initial[i].limitMax ?? null
  }));
}

function loadData(){
  const keys=[key,...legacyKeys];
  for(const k of keys){
    try{
      const raw=localStorage.getItem(k);
      if(raw){
        const parsed=JSON.parse(raw);
        if(Array.isArray(parsed) && parsed.length===initial.length) return normalize(parsed);
      }
    }catch(e){}
  }
  return normalize(initial);
}

let data=loadData();
let filter="all";

function saveData(){
  try{ localStorage.setItem(key,JSON.stringify(data)); }catch(e){}
}

function updateAchievementMeters(){
  const cap=data.filter(m=>m.max!==null).length;
  const defs=[
    ["max","bar-max","count-max"],
    ["min","bar-min","count-min"],
    ["lmax","bar-lmax","count-lmax"],
    ["lmin","bar-lmin","count-lmin"]
  ];
  defs.forEach(([field,barId,countId])=>{
    const done=cap ? data.filter(m=>m.max!==null && m[field]===1).length : 0;
    const pct=cap ? Math.round(done/cap*100) : 0;
    const bar=document.getElementById(barId);
    const count=document.getElementById(countId);
    if(bar) bar.style.width=pct+"%";
    if(count) count.textContent=done+"/"+cap+" ("+pct+"%)";
  });
}

function btn(i,t,label){
  const v=data[i][t]===1;
  let icon='👑';
  if(t==='lmax' || t==='lmin') icon='💎';
  return `<button type="button" class="crown ${v?'on':'off'}" data-i="${i}" data-t="${t}"><span class="icon">${icon}</span><small>${label}</small></button>`;
}

function render(){
  listEl.innerHTML="";
  data.forEach((x,i)=>{
    const goldComplete=x.max!==null && x.max===1 && x.min===1;
    const allComplete=x.max!==null && goldComplete && x.lmax===1 && x.lmin===1;
    const show=filter==="all" ||
      (filter==="max" && x.max!==null && x.max!==1) ||
      (filter==="min" && x.min!==null && x.min!==1) ||
      (filter==="inc" && x.max!==null && !allComplete);
    if(!show) return;

    const r=document.createElement("div");
    r.className="row"+(allComplete?" complete":(goldComplete?" gold-complete":""));
    const pic=x.img ? `<img class="pic" src="${x.img}" alt="">` : `<div class="pic"></div>`;
    const badges=x.max===null
      ? `<div class="na">対象外</div>`
      : `<div class="badges">${btn(i,"max","最大")}${btn(i,"min","最小")}${btn(i,"lmax","限界最大")}${btn(i,"lmin","限界最小")}</div>`;
    const limits=x.max===null || x.limitMin==null || x.limitMax==null ? ""
      : `<div class="limits"><span class="limit min">💎 限界最小 ${x.limitMin}</span><span class="limit max">💎 限界最大 ${x.limitMax}</span></div>`;
    r.innerHTML=pic+`<div class="info"><div class="name">${x.name}</div>${limits}</div>`+badges;
    listEl.appendChild(r);
  });
  updateAchievementMeters();
}

// Event delegation: re-renderしてもチェック処理が切れないようにする
listEl.addEventListener("click",(e)=>{
  const b=e.target.closest("button.crown");
  if(!b) return;
  const i=Number(b.dataset.i), t=b.dataset.t;
  if(!Number.isInteger(i) || !data[i] || !(t in data[i])) return;
  if(data[i][t]===null) return;
  data[i][t]=data[i][t]===1 ? 0 : 1;
  saveData();
  render();
});

document.querySelectorAll("[data-f]").forEach(b=>{
  b.addEventListener("click",()=>{
    filter=b.dataset.f;
    document.querySelectorAll("[data-f]").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    render();
  });
});

function setAllFilter(){
  filter="all";
  document.querySelectorAll("[data-f]").forEach(x=>x.classList.remove("active"));
  const all=document.querySelector('[data-f="all"]');
  if(all) all.classList.add("active");
}

function resetFields(fields, message){
  if(!confirm(message)) return;
  data=data.map((x,i)=>{
    const y={...x};
    fields.forEach(t=>{
      if(y[t]!==null && y[t]!==undefined) y[t]=0;
    });
    return y;
  });
  saveData();
  setAllFilter();
  render();
}

document.getElementById("resetGold").addEventListener("click",()=>{
  resetFields(["max","min"],"👑 最大・最小（金冠）のチェックをすべて外しますか？");
});

document.getElementById("resetLimit").addEventListener("click",()=>{
  resetFields(["lmax","lmin"],"💎 限界最大・限界最小のチェックをすべて外しますか？");
});

render();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
