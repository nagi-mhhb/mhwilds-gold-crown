<script>const initial=JSON.parse(document.getElementById("initial-data").textContent);

const key="mhwilds-crown-pwa-v20";
const legacyKeys=["mhwilds-crown-pwa-v16","mhwilds-crown-pwa-v15","mhwilds-crown-pwa-v14","mhwilds-crown-pwa-v13","mhwilds-crown-pwa-v12","mhwilds-crown-pwa-v11","mhwilds-crown-pwa-v10","mhwilds-crown-pwa-v7","mhwilds-crown-pwa-v6","mhwilds-crown-standalone-v5","mhwilds-crown-standalone-v4"];
const listEl=document.getElementById("list");

function normalize(a){
  return a.map((x,i)=>({...x,
    name: initial[i].name,
    max: x.max===null ? null : (x.max?1:0),
    min: x.min===null ? null : (x.min?1:0),
    lmax: x.lmax===null ? null : (x.lmax?1:0),
    lmin: x.lmin===null ? null : (x.lmin?1:0),
    limitMin: x.limitMin ?? initial[i].limitMin ?? null,
    limitMax: x.limitMax ?? initial[i].limitMax ?? null
  }));
}

function loadData(){
  const keys=[key,...legacyKeys];
  for(const k of keys){
    try{
      const raw=localStorage.getItem(k);
      if(raw){
        const parsed=JSON.parse(raw);
        if(Array.isArray(parsed) && parsed.length===initial.length) return normalize(parsed);
      }
    }catch(e){}
  }
  return normalize(initial);
}

let data=loadData();
let filter="all";
let searchText="";

function saveData(){
  try{ localStorage.setItem(key,JSON.stringify(data)); }catch(e){}
}

function updateAchievementMeters(){
  const cap=data.filter(m=>m.max!==null).length;
  const defs=[
    ["max","bar-max","count-max"],
    ["min","bar-min","count-min"],
    ["lmax","bar-lmax","count-lmax"],
    ["lmin","bar-lmin","count-lmin"]
  ];
  defs.forEach(([field,barId,countId])=>{
    const done=cap ? data.filter(m=>m.max!==null && m[field]===1).length : 0;
    const pct=cap ? Math.round(done/cap*100) : 0;
    const bar=document.getElementById(barId);
    const count=document.getElementById(countId);
    if(bar) bar.style.width=pct+"%";
    if(count) count.textContent=done+"/"+cap+" ("+pct+"%)";
  });
}

function btn(i,t,label){
  const v=data[i][t]===1;
  const icon=(t==='max'||t==='min') ? `<img class="check-icon crown-check-icon ${t}" src="${crownIconSources[t]}" alt="" decoding="async">` : `<img class="check-icon gem-check-icon ${t}" src="${gemIconSources[t==='lmax'?'pink':'blue']}" alt="" decoding="async">`;
  return `<button type="button" class="crown ${v?'on':'off'}" data-i="${i}" data-t="${t}"><span class="icon">${icon}</span><small>${label}</small></button>`;
}

function render(){
  listEl.innerHTML="";
  data.forEach((x,i)=>{
    const goldComplete=x.max!==null && x.max===1 && x.min===1;
    const allComplete=x.max!==null && goldComplete && x.lmax===1 && x.lmin===1;
    const matchesSearch=!searchText || x.name.toLocaleLowerCase().includes(searchText.toLocaleLowerCase());
    const hasNormal=x.max!==null && x.min!==null;
    const hasLimit=x.lmax!==null && x.lmin!==null;
    const show=matchesSearch && (filter==="all" ||
      (filter==="max" && x.max!==null && x.max!==1) ||
      (filter==="min" && x.min!==null && x.min!==1) ||
      (filter==="goldIncomplete" && hasNormal && (x.max!==1 || x.min!==1)) ||
      (filter==="lmax" && x.lmax!==null && x.lmax!==1) ||
      (filter==="lmin" && x.lmin!==null && x.lmin!==1));
    if(!show) return;

    const r=document.createElement("div");
    r.className="row"+(allComplete?" complete":(goldComplete?" gold-complete":""));
    const pic=x.img ? `<img class="pic" src="${x.img}" alt="" loading="lazy" decoding="async">` : `<div class="pic"></div>`;
    const badges=x.max===null
      ? `<div class="na">対象外</div>`
      : `<div class="badges">${btn(i,"max","最大")}${btn(i,"min","最小")}${btn(i,"lmax","限界最大")}${btn(i,"lmin","限界最小")}</div>`;
    const statusGold=goldComplete ? `<span class="completion-badge gold"><img class="inline-status-icon crown-status-icon" src="${crownIconSources.max}" alt="">済</span>` : "";
    const statusLimit=(x.lmax===1 && x.lmin===1) ? `<span class="completion-badge limit"><img class="inline-status-icon gem-status-icon" src="${gemIconSources.pink}" alt="">済</span>` : "";
    const status=(x.max!==null) ? `<div class="completion-status">${statusGold || '<span class="completion-badge empty"><span class="status-placeholder">👑済</span></span>'}${statusLimit || '<span class="completion-badge empty"><span class="status-placeholder">💎済</span></span>'}</div>` : "";
    const limits=x.max===null || x.limitMin==null || x.limitMax==null ? ""
      : `<div class="limits"><div class="limit-values"><span class="limit max"><img class="inline-limit-icon" src="${gemIconSources.pink}" alt="">限界最大 ${x.limitMax}</span><span class="limit min"><img class="inline-limit-icon" src="${gemIconSources.blue}" alt="">限界最小 ${x.limitMin}</span></div>${status}</div>`;
    r.innerHTML=pic+`<div class="info"><div class="name">${x.name}</div>${limits}</div>`+badges;
    listEl.appendChild(r);
  });
  updateAchievementMeters();
}

// Event delegation: re-renderしてもチェック処理が切れないようにする
listEl.addEventListener("click",(e)=>{
  const b=e.target.closest("button.crown");
  if(!b) return;
  const i=Number(b.dataset.i), t=b.dataset.t;
  if(!Number.isInteger(i) || !data[i] || !(t in data[i])) return;
  if(data[i][t]===null) return;
  data[i][t]=data[i][t]===1 ? 0 : 1;
  saveData();
  // Fast path: when the full list is visible, update only the tapped row.
  // Rebuilding every card reassigns several large embedded data-URI images and caused tap lag.
  if(filter!=="all" || searchText){ render(); return; }
  b.classList.toggle("on",data[i][t]===1);
  b.classList.toggle("off",data[i][t]!==1);
  const row=b.closest(".row");
  if(row){
    const m=data[i];
    const goldComplete=m.max!==null && m.max===1 && m.min===1;
    const allComplete=m.max!==null && goldComplete && m.lmax===1 && m.lmin===1;
    row.classList.toggle("gold-complete",goldComplete&&!allComplete);
    row.classList.toggle("complete",allComplete);
    const status=row.querySelector(".completion-status");
    if(status){
      status.innerHTML=(m.max!==null ? `${goldComplete?`<span class="completion-badge gold"><img class="inline-status-icon crown-status-icon" src="${crownIconSources.max}" alt="">済</span>`:'<span class="completion-badge empty"><span class="status-placeholder">👑済</span></span>'}${m.lmax===1&&m.lmin===1?`<span class="completion-badge limit"><img class="inline-status-icon gem-status-icon" src="${gemIconSources.pink}" alt="">済</span>`:'<span class="completion-badge empty"><span class="status-placeholder">💎済</span></span>'}` : "");
    }
  }
  updateAchievementMeters();
});

document.querySelectorAll("[data-f]").forEach(b=>{

function exportBackup(){
  const payload={
    format:"mhwilds-crown-backup",
    version:21,
    exportedAt:new Date().toISOString(),
    data:data
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const stamp=new Date().toISOString().slice(0,10);
  const filename=`mhwilds-gold-crown-backup-${stamp}.json`;
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // ダウンロード開始後にURLを解放し、作成したファイル名をポップアップで知らせる
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  alert(`バックアップファイルを作成しました！\n\nファイル名：\n${filename}\n\nダウンロード先はブラウザの設定に従います。`);
}

function importBackup(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      const incoming=Array.isArray(parsed) ? parsed : parsed.data;
      if(!Array.isArray(incoming) || incoming.length!==initial.length) throw new Error("invalid");
      data=normalize(incoming);
      saveData();
      setAllFilter();
      render();
      alert("バックアップを復元しました。");
    }catch(e){
      alert("バックアップファイルを読み込めませんでした。");
    }
  };
  reader.readAsText(file);
}

function showLimitFound(monster,size,matchesMax,matchesMin){
  const card=document.getElementById("limitFoundCard");
  card.classList.toggle("pink",matchesMax);
  const title=document.getElementById("limitFoundTitle");
  title.textContent=matchesMax&&matchesMin?"💎 限界最大・最小 発見！":matchesMax?"💎 限界最大サイズ発見！":"💎 限界最小サイズ発見！";
  const image=document.getElementById("limitFoundMonster");
  if(monster.img){image.src=monster.img;image.style.display="block";}else{image.removeAttribute("src");image.style.display="none";}
  image.alt=monster.name+"のモンスターアイコン";
  document.getElementById("limitFoundName").textContent=monster.name;
  document.getElementById("limitFoundSize").textContent="測定サイズ："+size;
  document.getElementById("limitFoundConfirm").textContent=matchesMax&&matchesMin?"✓ 限界最大・最小を自動チェックしました！":matchesMax?"✓ 限界最大を自動チェックしました！":"✓ 限界最小を自動チェックしました！";
  limitFoundPopup.hidden=false;
  if(limitFoundTimer!==null)clearTimeout(limitFoundTimer);
  limitFoundTimer=setTimeout(closeLimitFound,4000);
}

document.getElementById("checkSizeBtn").addEventListener("click",()=>{
  const i=Number(sizeMonster.value);
  const raw=document.getElementById("sizeInput").value;
  const result=document.getElementById("sizeCheckResult");
  if(sizeMonster.value==="" || raw.trim()===""){
    result.textContent="モンスターと測定サイズを入力してください。"; return;
  }
  const size=Number(raw), m=data[i];
  if(!m || !Number.isFinite(size)){
    result.textContent="入力内容を確認してください。"; return;
  }
  const matchesMax=Number(size)===Number(m.limitMax);
  const matchesMin=Number(size)===Number(m.limitMin);
  if(matchesMax){ m.lmax=1; }
  if(matchesMin){ m.lmin=1; }
  saveData(); render();
  if(matchesMax && matchesMin){
    result.textContent=`${m.name}：限界最大・限界最小の両方に一致！両方チェックしました。`;
    showLimitFound(m,size,matchesMax,matchesMin);
  }else if(matchesMax){
    result.textContent=`${m.name}：💎 限界最大 ${m.limitMax} に一致！限界最大にチェックしました。`;
    showLimitFound(m,size,matchesMax,matchesMin);
  }else if(matchesMin){
    result.textContent=`${m.name}：💎 限界最小 ${m.limitMin} に一致！限界最小にチェックしました。`;
    showLimitFound(m,size,matchesMax,matchesMin);
  }else{
    result.textContent=`${m.name}：限界サイズとは一致しません（最大 ${m.limitMax} ／ 最小 ${m.limitMin}）。チェックは変更していません。`;
